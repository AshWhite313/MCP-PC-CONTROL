# Default policy for mcp-pc-control. Copy it, edit it and pass it with --policy.
# Unknown keys are rejected, so typos fail loudly at startup.

[general]
# observe  : read-only (screenshots, window list)
# interact : + mouse, keyboard, window management
# operate  : + files, starting apps (future phases)
# full     : + shell, killing processes (future phases) — still with confirmations
level = "interact"
# Which tools are exposed: observe | desktop | browser | full
profile = "desktop"
# Human confirmation channels, in order of preference. native_dialog is a dialog shown by this
# server on the local desktop (the AI client cannot answer it). elicitation asks through the MCP client.
confirmation_channels = ["native_dialog", "elicitation"]
confirmation_timeout_s = 120
disabled_tools = []

[limits]
max_actions_per_minute = 120
max_wait_ms = 120000
# Global hotkey that stops (and, pressed again, resumes) all automation.
killswitch_hotkey = "ctrl+alt+shift+f12"

[audit]
enabled = true
# dir = "%LOCALAPPDATA%/mcp-pc-control/audit"   (default)
# Typed text is replaced by its length in the audit log unless this is true.
log_typed_text = false

[privacy]
redact_patterns = ["credit_card", "cpf", "api_key"]
# Windows of these processes are blacked out in every screenshot (never sent to the model).
never_capture_processes = ["keepassxc.exe", "keepass.exe", "1password.exe", "bitwarden.exe"]

[processes]
kill_protected = ["csrss.exe", "wininit.exe", "winlogon.exe", "lsass.exe", "services.exe", "smss.exe",
                  "svchost.exe", "MsMpEng.exe", "dwm.exe"]

[screen]
# Screenshots are downscaled so the longest side is at most this many pixels.
max_long_edge = 1568

[ui]
# Clicking an element whose label contains one of these words requires human confirmation.
high_impact_keywords = ["excluir", "apagar", "deletar", "delete", "pagar", "pay", "comprar", "buy", "purchase",
                        "transferir", "transfer", "enviar", "send", "desinstalar", "uninstall"]

[filesystem]
# Folders the agent may save downloads into / upload files from. "known:<Folder>" follows the real
# user folder (including OneDrive redirection).
allowed_roots = ["known:Downloads", "known:Documents", "known:Desktop", "~/AgentWorkspace"]
denied_globs = ["**/.ssh/**", "**/.gnupg/**", "**/.aws/**", "**/*.kdbx", "**/*.pem", "**/*.key", "**/.env",
                "**/.env.*", "**/.git-credentials", "**/.netrc",
                "**/AppData/Roaming/Microsoft/Credentials/**", "**/AppData/Local/Google/Chrome/User Data/**",
                "**/AppData/Local/Microsoft/Edge/User Data/**"]

[browser]
# chromium (Playwright build) | msedge | chrome
channel = "chromium"
executable_path = ""
headless = false
# A profile dedicated to the agent, separate from your personal browser profile.
profile_dir = "~/AgentWorkspace/browser-profile"
# Empty allowlist = any site except the denylist. Entries also match subdomains.
url_allowlist = []
url_denylist = []
# Running arbitrary JavaScript in pages; each call is also confirmed.
allow_evaluate = false
default_timeout_ms = 15000
